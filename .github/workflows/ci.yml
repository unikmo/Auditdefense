name: AuditDefend demo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax checks
        run: |
          node --check public/app.js
          node --check public/firebase-client.js
          node --check functions/index.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase-project.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
      - name: Assert synthetic-only demo boundary
        run: |
          grep -q "No PHI is stored or transmitted" public/index.html
          grep -q "synthetic == true" firestore.rules
          grep -q "metadata.synthetic == 'true'" storage.rules
