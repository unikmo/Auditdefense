name: AuditDefend demo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax checks
        run: |
          npm run check
          node --check functions/index.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase-project.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/policy-sources.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('public/policy-status.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/policy-rules.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/recovery-rules.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/policy-changes.json','utf8'))"
      - name: Assert redacted no-PHI pilot boundary
        run: |
          grep -q "PHI ingestion remains disabled" public/index.html
          grep -q "When a payer says you owe money" public/index.html
          grep -q "Stop spending legal hours reconstructing the audit" public/attorney.html
          grep -q "No PHI" public/attorney-workspace.html
          grep -q "Unclaimed public-source profile" public/attorneys.js
          grep -q "Redacted/non-PHI only" public/provider-onboarding.html
          grep -Eq "containsPhi[[:space:]]*==[[:space:]]*false" firestore.rules
          grep -Eq "counselOnly[[:space:]]*==[[:space:]]*true" firestore.rules
          grep -q "attorneyUids" firestore.rules
          grep -q "providerOrganizations" firestore.rules
          grep -q "providerCases" firestore.rules
          grep -q "providerInvites" firestore.rules
          grep -q "attorneyDirectoryClaims" firestore.rules
          grep -q "POLICY INTELLIGENCE" public/app.html
          grep -q "Open exact PDF page" public/policy-intelligence.js
          grep -q "POLICY_CONFLICT_CANDIDATE" public/policy-engine.js
          grep -q "POTENTIALLY_OUTSIDE_WINDOW" public/recovery-engine.js
          grep -q "NY-COMMERCIAL-OVERPAYMENT-24M" data/recovery-rules.json
          grep -q "FIDELIS-READMISSION-30D-2026-10-01" data/policy-changes.json
          grep -q "17 7 \* \* \*" .github/workflows/policy-monitor.yml
          grep -q "uhc-community-reimbursement" data/policy-sources.json
          grep -q "aetna-officelink-updates" data/policy-sources.json
          grep -q "fidelis-provider-policies" data/policy-sources.json
      - name: Assert private keys are not committed
        run: |
          ! git grep -n "BEGIN PRIVATE KEY" -- ':!*.md'
          ! git ls-files | grep -E '(^|/)(service-account.*\.json|firebase-admin\.json)$'
