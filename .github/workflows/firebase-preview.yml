name: Firebase non-production preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: npm run check
      - name: Deploy preview channel only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUDITDEFENSE_2CB01 }}
          projectId: auditdefense-2cb01
          expires: 7d
          channelId: auditdefend-demo

# Intentionally no live/production deployment step.
# Put the existing Firebase service-account JSON directly into the GitHub Actions
# secret named FIREBASE_SERVICE_ACCOUNT_AUDITDEFENSE_2CB01. Never commit it.
